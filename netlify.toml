[build]
  command = "npm run build && node scripts/emit-deploy-headers.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# sharp は native addon。esbuild に潰さず node_modules として同梱する（linux x64 バイナリ必須）。
[functions]
  external_node_modules = ["sharp"]

# チラシ: 画像デコード負荷。memory は Credit-based Pro+ で有効。
[functions."flyer-weekly"]
  external_node_modules = ["sharp"]
  memory = "2048"

[context.production]
  command = "npm run verify:openrouter:models && npm run verify:sharp:netlify && npm run build && node scripts/emit-deploy-headers.mjs"

[context.deploy-preview]
  command = "npm run verify:sharp:netlify && npm run build && node scripts/emit-deploy-headers.mjs"

[context.branch-deploy]
  command = "npm run verify:sharp:netlify && npm run build && node scripts/emit-deploy-headers.mjs"

[[redirects]]
  from = "/api/emergency-menus"
  to = "/.netlify/functions/emergency-menus"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# CSP は context 別に dist/_headers へ emit する（scripts/emit-deploy-headers.mjs）。
# Netlify の [[headers]] は全 context 共通のため、ここでは CSP 以外のみ置く。
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
