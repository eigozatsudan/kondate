<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>こんだて日和の番号</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f2efec;
      color: #26211e;
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f2efec">
      <tr>
        <td align="center" style="padding: 32px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 480px; background-color: #faf9f8; border: 1px solid #e7e2dd; border-radius: 16px"
          >
            <tr>
              <td style="padding: 28px 24px 8px; text-align: center">
                <p style="margin: 0; font-size: 13px; letter-spacing: 0.08em; color: #b85033">こんだて日和</p>
                <h1 style="margin: 8px 0 0; font-size: 22px; line-height: 1.4; font-weight: 700">ログイン用の番号です</h1>
              </td>
            </tr>
            <tr>
              <td style="padding: 8px 24px 0; text-align: center">
                <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #57504b">
                  アプリの画面に、この 6 つの数字を入力してください。
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 24px">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td
                      align="center"
                      style="
                        padding: 20px 12px;
                        background-color: #fdf1ec;
                        border: 1px solid #f9e3da;
                        border-radius: 12px;
                        font-size: 36px;
                        line-height: 1.2;
                        letter-spacing: 0.28em;
                        font-weight: 700;
                        color: #26211e;
                      "
                    >
                      {{ .Token }}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 0 24px 28px">
                <p style="margin: 0 0 10px; font-size: 14px; line-height: 1.7; color: #57504b">
                  パスワードの設定は不要です。はじめての方も、この番号から進めます。
                </p>
                <p style="margin: 0 0 10px; font-size: 14px; line-height: 1.7; color: #57504b">
                  番号には有効期限があります。使えないときは、アプリの画面からもう一度受け取ってください。
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 1.7; color: #8e8681">
                  このメールに心当たりがない場合は、削除して問題ありません。
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
