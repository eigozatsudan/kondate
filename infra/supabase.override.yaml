services:
  db:
    ports:
      - "127.0.0.1:54322:5432"
  kong:
    ports: !override
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
  # migrate（親 compose）完了前に catalog/REST/Storage が触ると、
  # コールドスタートの DDL と競合して psql ON_ERROR_STOP が exit 3 になることがある。
  # auth だけは GoTrue が auth schema を先に用意する必要があるため migrate の前に立てる。
  rest:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  meta:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  realtime:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  storage:
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
      migrate:
        condition: service_completed_successfully
  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Supavisor image が起動時に 100000 へ引き上げるため、Docker 側の上限も一致させる。
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    # 初回起動は migrate + tenant eval + server の直列で、CI コールドスタートでは
    #  upstream 既定 start_period(30s) を超えやすい。期間中の失敗はカウントされないため
    # 猶予を延ばし、通常開発の待ち時間増は start_period 内の成功で打ち切られる。
    healthcheck:
      test:
        ["CMD", "curl", "-sSfL", "--head", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 180s
  auth:
    environment:
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${ENABLE_GOOGLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
