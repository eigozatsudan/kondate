services:
  db:
    ports:
      - "127.0.0.1:54322:5432"
  kong:
    ports: !override
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8443:8443"
  # migrate（親 compose）完了前に catalog/REST/Storage が触ると、
  # コールドスタートの DDL と競合して psql ON_ERROR_STOP が exit 3 になることがある。
  # auth だけは GoTrue が auth schema を先に用意する必要があるため migrate の前に立てる。
  rest:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  meta:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  realtime:
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  storage:
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
      migrate:
        condition: service_completed_successfully
  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Supavisor image が起動時に 100000 へ引き上げるため、Docker 側の上限も一致させる。
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    # 初回起動は migrate + tenant eval + server の直列で、CI コールドスタートでは
    #  upstream 既定 start_period(30s) を超えやすい。期間中の失敗はカウントされないため
    # 猶予を延ばし、通常開発の待ち時間増は start_period 内の成功で打ち切られる。
    healthcheck:
      test:
        ["CMD", "curl", "-sSfL", "--head", "-o", "/dev/null", "http://127.0.0.1:4000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 180s
  # GoTrue の TEMPLATES_* は HTTP URL だけを取る。file:// は live 根拠が無く、
  # host.docker.internal は Linux の auth から届かない。ホスト公開はしない。
  otp-templates:
    image: nginx:alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        printf '%s\n' \
          'server {' \
          '  listen 8080;' \
          '  root /home/templates;' \
          '  location / { try_files $$uri =404; }' \
          '}' \
          > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      # include グループの基準は infra/supabase/。./templates が
      # infra/supabase/templates になる。./supabase/templates だと二重になる。
      - ./templates:/home/templates:ro
  auth:
    depends_on:
      otp-templates:
        condition: service_started
    volumes:
      - ./templates:/home/templates:ro
    environment:
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ${SMTP_USER}
      GOTRUE_SMTP_PASS: ${SMTP_PASS}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${ENABLE_GOOGLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      # 寿命は hosted 既定の 3600 に揃え、CONFIG 既定 86400 を正にしない。
      GOTRUE_MAILER_OTP_EXP: "3600"
      GOTRUE_MAILER_OTP_LENGTH: "6"
      # 画面再送（local 60s）より緩めない。e2e の 1s は suite 専用でここへ写さない。
      GOTRUE_SMTP_MAX_FREQUENCY: "60s"
      GOTRUE_RATE_LIMIT_OTP: "30"
      GOTRUE_RATE_LIMIT_VERIFY: "360"
      # GoTrue の POST /otp（メール）は内部で MagicLink と同じ入口。
      # false にすると 6 桁番号も 422 email_provider_disabled になる。
      # URL 経路の防御は URL 無しテンプレ側に置く。
      GOTRUE_EXTERNAL_EMAIL_MAGIC_LINK_ENABLED: "true"
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://otp-templates:8080/otp-code.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://otp-templates:8080/otp-code.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: こんだて日和の番号
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: こんだて日和の番号
