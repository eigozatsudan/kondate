<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      iOS のホーム画面アプリは viewport-fit が auto だと
      env(safe-area-inset-bottom) が 0 のままになり、Face ID の
      ホームインジケータが下タブラベルに重なる。.bottom-nav の
      padding を効かせるため cover にする。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf9f8" />
    <!-- C8: OAuth callback の code が Referer 経由で外部へ漏れないよう既定を厳しくする -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="こんだて日和" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>こんだて日和</title>
    <!-- kondate-public-lp-head -->
    <script src="/lp-boot.js"></script>
  </head>
  <body>
    <div id="kondate-public-lp"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
