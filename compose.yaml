name: "${KONDATE_COMPOSE_PROJECT_NAME:?KONDATE_COMPOSE_PROJECT_NAME is required}"

include:
  - path:
      - ./infra/supabase/docker-compose.yml
      - ./infra/supabase.override.yaml
    env_file: ./.env

# Compose v5: include で取り込んだサービス（kong / supavisor 等）を
# このファイルの services で同名再定義すると
# "services.<name> conflicts with imported resource" で config が失敗する。
# ポートの 127.0.0.1 固定は infra/supabase.override.yaml 側で行う。

services:
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  openrouter-mock:
    image: node:24-bookworm-slim
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./tools/openrouter-mock/server.mjs:/app/server.mjs:ro
      - ./tools/openrouter-mock/fixtures:/app/fixtures:ro
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  oauth-mock:
    image: node:24-bookworm-slim
    command: ["node", "/app/server.mjs"]
    depends_on:
      auth:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      OAUTH_MOCK_USER_PASSWORD: ${OAUTH_MOCK_USER_PASSWORD}
    volumes:
      - ./tools/oauth-mock/server.mjs:/app/server.mjs:ro
      - ./tools/oauth-mock/fixtures:/app/fixtures:ro
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8788/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  migrate:
    image: supabase/postgres:17.6.1.136
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    entrypoint: ["/workspace/scripts/apply-migrations.sh"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    volumes:
      - .:/workspace:ro
    restart: "no"

  db-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.db-test
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/workspace/scripts/run-pgtap.sh"]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    volumes:
      - .:/workspace:ro
    restart: "no"

  app:
    build:
      context: .
      target: development
    depends_on:
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      openrouter-mock:
        condition: service_healthy
      oauth-mock:
        condition: service_healthy
      meta:
        condition: service_healthy
    environment:
      # コンテナ内では localhost が ::1 を先に返すため、@netlify/functions-dev の
      # streaming bridge が ::1 にbindし 127.0.0.1 へ接続して ECONNREFUSED になる。
      # IPv4を優先させ、dev中のFunction呼び出しを成立させる。
      NODE_OPTIONS: --dns-result-order=ipv4first
      VITE_SUPABASE_URL: http://127.0.0.1:8000
      VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      VITE_MAGIC_LINK_RESEND_SECONDS: ${VITE_MAGIC_LINK_RESEND_SECONDS:-60}
      VITE_AUTH_CONTINUATION_TTL_MS: ${VITE_AUTH_CONTINUATION_TTL_MS:-300000}
      VITE_AUTH_PROVIDER_MODE: ${VITE_AUTH_PROVIDER_MODE:-oauth_mock}
      VITE_OAUTH_MOCK_ORIGIN: ${VITE_OAUTH_MOCK_ORIGIN:-http://127.0.0.1:8788}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SERVER_SITE_ORIGIN: ${SERVER_SITE_ORIGIN:-http://127.0.0.1:5173}
      AUTH_CONTINUATION_ENCRYPTION_KEY: ${AUTH_CONTINUATION_ENCRYPTION_KEY}
      AUTH_CONTINUATION_TTL_SECONDS: ${AUTH_CONTINUATION_TTL_SECONDS:-300}
      GENERATION_REQUEST_HMAC_KEY: ${GENERATION_REQUEST_HMAC_KEY}
      QUOTA_IDENTITY_HMAC_KEY: ${QUOTA_IDENTITY_HMAC_KEY}
      # 既定は openrouter-mock。本番相当の実 API は .env で上書きする（README 参照）。
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-local-mock-key}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-mock/kondate-primary:free,mock/kondate-repair:free}
      OPENROUTER_PLUS_MODELS: ${OPENROUTER_PLUS_MODELS:-mock/kondate-primary:free,mock/kondate-repair:free}
      # 任意。未設定時は Function が OPENROUTER_PLUS_MODELS にフォールバック。
      OPENROUTER_FLYER_MODELS: ${OPENROUTER_FLYER_MODELS:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-http://openrouter-mock:8787/api/v1}
      USER_DAILY_AI_LIMIT: "3"
      USER_DAILY_EXTERNAL_CALL_LIMIT: "6"
      USER_SHORT_WINDOW_EXTERNAL_CALL_LIMIT: "4"
      USER_SHORT_WINDOW_SECONDS: "600"
      GLOBAL_DAILY_AI_LIMIT: "20"
      OPENROUTER_TIMEOUT_MS: "24000"
      FUNCTION_TOTAL_BUDGET_MS: "55000"
      AI_PROCESSING_STALE_SECONDS: "180"
      # ローカル個人枠スキップ。true は SERVER_SITE_ORIGIN が 127.0.0.1:5173 のときのみ有効（非 local は parse throw）。
      AI_QUOTA_DISABLED: ${AI_QUOTA_DISABLED:-false}
      # Billing / Stripe（local 既定は kill。鍵を載せると Webhook のみ A3 で稼働可）
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PLUS_MONTHLY: ${STRIPE_PRICE_PLUS_MONTHLY:-}
      STRIPE_PRICE_PLUS_YEARLY: ${STRIPE_PRICE_PLUS_YEARLY:-}
      STRIPE_API_VERSION: ${STRIPE_API_VERSION:-2026-06-24.dahlia}
      STRIPE_MOCK_BASE_URL: ${STRIPE_MOCK_BASE_URL:-}
      # entrypoint が setpriv で落とす先。Compose の user 補間とは別に process.env へ渡す。
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"
    # root で entrypoint を起動し、node_modules/.vite-temp と passwd/home を整えてから LOCAL_UID へ落とす。
    # （GHA runner 等 LOCAL_UID≠1000 でも Vite / Netlify Edge Deno が起動できるようにする）
    # Compose が entrypoint を上書きすると image の CMD が null になるため command を明示する。
    user: "0:0"
    entrypoint: ["/usr/local/bin/app-entrypoint.sh"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    tmpfs:
      - /workspace/.netlify:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
      - /workspace/dist:uid=${LOCAL_UID:-1000},gid=${LOCAL_GID:-1000},mode=1777
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 2s
      timeout: 2s
      retries: 30

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      target: e2e
    network_mode: host
    depends_on:
      app:
        condition: service_healthy
    environment:
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"
      # full の mobile||desktop 並列時、run-e2e.sh が project ごとに上書きする。
      # 未設定時は従来どおりリポジトリ直下の既定パス。
      KONDATE_E2E_OUTPUT_DIR: "${KONDATE_E2E_OUTPUT_DIR:-test-results}"
      KONDATE_E2E_HTML_REPORT: "${KONDATE_E2E_HTML_REPORT:-playwright-report}"
    # app と同じく root→LOCAL_UID。Playwright のキャッシュ解決にも passwd/home が必要。
    # entrypoint に playwright まで含め、compose run e2e の追加引数が末尾連結される形を保つ。
    user: "0:0"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    entrypoint: ["/usr/local/bin/app-entrypoint.sh", "npx", "playwright", "test"]

  # 本番/ステージング向け Netlify CLI（既定の up には載せない。profile deploy のみ）。
  # ホストに Node / netlify-cli を入れず、package.json ピン留めの CLI を使う。
  # 認証は対話 login より NETLIFY_AUTH_TOKEN（Personal Access Token）を推奨。
  # サイト紐付けは NETLIFY_SITE_ID または作業ツリーの .netlify/（gitignored）。
  # コンテナ env は .deploy.env のみ。workspace の .env は Vite dotenv が読むため
  # .deploy.env で上書きマウントする（ローカル VITE_OAUTH_MOCK_ORIGIN 等が
  # production バンドルに焼け getPublicEnv が throw → 本番白画面になるのを防ぐ）。
  # ` docker compose --profile deploy run --rm netlify-cli deploy --build --prod`
  netlify-cli:
    profiles: ["deploy"]
    build:
      context: .
      target: development
    user: "0:0"
    working_dir: /workspace
    env_file:
      - ./.deploy.env
    environment:
      # entrypoint の setpriv 用。ホスト UID はプロジェクト .env 補間で揃え、
      # デプロイ秘密（NETLIFY_* 等）は env_file の .deploy.env だけから入れる。
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
      # ローカル開発用 .env を隠し、deploy 用だけを Vite / preflight に見せる
      - ./.deploy.env:/workspace/.env:ro
    # run の追加引数が末尾に連結される（例: ... netlify-cli status）
    entrypoint: ["/usr/local/bin/app-entrypoint.sh", "npx", "netlify"]
    restart: "no"

  # 本番/ステージング向け Supabase CLI（既定の up には載せない。profile deploy のみ）。
  # 認証は SUPABASE_ACCESS_TOKEN。DB 操作は .deploy.env の SUPABASE_DB_URL を
  # scripts/supabase-cli-wrapper.sh が db push / migration list に自動注入する
  # （ホストの "$SUPABASE_DB_URL" 展開に依存しない。正本: docs/deployment/supabase.md）。
  # コンテナ env は .deploy.env のみ（ローカル開発用 .env の秘密を注入しない）。
  # `docker compose --profile deploy run --rm supabase-cli db push --include-all`
  supabase-cli:
    profiles: ["deploy"]
    build:
      context: .
      target: development
    user: "0:0"
    working_dir: /workspace
    env_file:
      - ./.deploy.env
    environment:
      # entrypoint の setpriv 用。ホスト UID はプロジェクト .env 補間で揃え、
      # デプロイ秘密（SUPABASE_* 等）は env_file の .deploy.env だけから入れる。
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    # wrapper は workspace マウント上のスクリプト（再ビルド不要）。sh 経由で実行ビット非依存。
    entrypoint:
      ["/usr/local/bin/app-entrypoint.sh", "sh", "/workspace/scripts/supabase-cli-wrapper.sh"]
    restart: "no"

volumes:
  node_modules:
